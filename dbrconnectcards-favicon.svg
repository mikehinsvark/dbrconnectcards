<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">DBR Connect Cards</title>
  <desc id="desc">A cyan and gold connected-card mark on a dark navy rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1F35"/>
      <stop offset="1" stop-color="#050D18"/>
    </linearGradient>
    <linearGradient id="front" x1="12" y1="23" x2="47" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123449"/>
      <stop offset="1" stop-color="#0A1829"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#00E5C8" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="17" y="17" width="34" height="26" rx="5" fill="#0D1F35" stroke="#4A7A8A" stroke-width="2.5"/>
  <rect x="12" y="23" width="35" height="26" rx="5" fill="url(#front)" stroke="#00E5C8" stroke-width="2.75"/>
  <path d="M19 34.5H40" fill="none" stroke="#7AA8B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 39.5H39" fill="none" stroke="#00E5C8" stroke-width="2.75" stroke-linecap="round"/>
  <circle cx="22" cy="39.5" r="3.75" fill="#D7B458" stroke="#F4D77B" stroke-width="1"/>
  <circle cx="39" cy="39.5" r="3.75" fill="#00E5C8" stroke="#E8F4F8" stroke-width="1"/>
</svg>
